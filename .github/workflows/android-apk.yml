name: Android APK

on:
  push:
    branches: [main, claude/pico2-universal-flasher-xau7rj]
    paths:
      - "pico2-flasher-android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "pico2-flasher-android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pico2-flasher-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PicoFlasher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PicoFlasher-apk
          path: pico2-flasher-android/PicoFlasher.apk

      # A stable download page to open on the phone.
      - name: Publish download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pico-flasher-android
          name: Pico Flasher for Android
          prerelease: false
          make_latest: true
          files: pico2-flasher-android/PicoFlasher.apk
          body: |
            **Pico Flasher**: put programs on your Raspberry Pi Pico 2 (or Pico) from an Android phone.

            📱 On your phone, tap **PicoFlasher.apk** below to download it, then open it to install.
            If your phone asks, allow installing apps from your browser or Files app.

            Built from ${{ github.sha }}.
